<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Técnicos | RJvidros OS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="dashboard-page">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">RJ</div>
        <div class="sidebar-brand">
          <h3>RJvidros</h3>
          <small>v1.0</small>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="clientes.html">Clientes</a>
        <a href="ordens.html">Ordens</a>
        <a href="solicitacoes.html">Solicitações</a>
        <a href="tecnicos.html" class="active">Técnicos</a>
        <a href="financeiro.html">Financeiro</a>
        <button id="sidebarLogout">Sair</button>
      </nav>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div>
          <h1>Gerenciar Técnicos</h1>
          <p id="userGreeting">Bem-vindo!</p>
        </div>
        <div class="topbar-actions">
          <button class="theme-toggle" id="themeToggle">Tema</button>
          <button id="logoutButton" class="button-secondary">Sair</button>
        </div>
      </header>

      <main class="container">
        <section class="split-panel">
          <form id="techForm" class="panel form-card">
            <h2>Novo Técnico</h2>
            <label>Nome<input type="text" id="techName" required /></label>
            <label>Telefone<input type="text" id="techPhone" /></label>
            <label>E-mail<input type="email" id="techEmail" required /></label>
            <label>Especialidade<input type="text" id="techSpecialty" placeholder="Ex.: box, portas, espelhos" /></label>
            <label>Status
              <select id="techStatus">
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
              </select>
            </label>
            <label>Observações<textarea id="techNotes"></textarea></label>
            <button type="submit" class="button-primary">Cadastrar técnico</button>
            <p id="techFeedback" class="success-message"></p>
          </form>

          <div class="panel">
            <div class="panel-header">
              <h2>Lista de Técnicos</h2>
              <button id="refreshTecnicos" class="button-tertiary">Atualizar</button>
            </div>
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Especialidade</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="techTable"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="toast" class="toast" style="display: none;"></div>

  <script src="js/ApiService.js"></script>
  <script src="js/AuthManager.js"></script>
  <script src="js/ToastManager.js"></script>
  <script src="js/UIManager.js"></script>
  <script src="js/tecnicos.js"></script>
</body>
</html>
